<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦖 Godzilla - Temperature Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/paho-mqtt@1.1.0/paho-mqtt.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: grid 20s linear infinite;
        }
        
        @keyframes grid {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            box-shadow: 0 30px 90px rgba(0,0,0,0.4);
            padding: 50px;
            max-width: 700px;
            width: 100%;
            position: relative;
            z-index: 1;
            animation: fadeIn 0.8s ease-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .header {
            text-align: center;
            margin-bottom: 35px;
        }
        
        h1 {
            color: #1e293b;
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        .godzilla-emoji {
            font-size: 60px;
            display: inline-block;
            animation: bounce 2s ease-in-out infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .candidate {
            text-align: center;
            color: #64748b;
            font-size: 18px;
            font-weight: 400;
            margin-bottom: 30px;
            padding: 10px;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            border-radius: 10px;
        }
        
        .candidate-name {
            font-weight: 600;
            color: #334155;
        }
        
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .status-bar.connected {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        
        .status-bar.disconnected {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }
        
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: white;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .temp-card {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
            color: white;
            padding: 50px;
            border-radius: 25px;
            text-align: center;
            margin: 25px 0;
            box-shadow: 0 15px 40px rgba(99, 102, 241, 0.4);
            position: relative;
            overflow: hidden;
        }
        
        .temp-card::before {
            content: '🌡️';
            position: absolute;
            font-size: 200px;
            opacity: 0.1;
            top: -50px;
            right: -50px;
            transform: rotate(-15deg);
        }
        
        .temp-label {
            font-size: 20px;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.9;
            margin-bottom: 10px;
        }
        
        .temp-display {
            display: flex;
            justify-content: center;
            align-items: baseline;
            margin: 20px 0;
            position: relative;
        }
        
        .temp-value {
            font-size: 96px;
            font-weight: 700;
            line-height: 1;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        
        .temp-unit {
            font-size: 48px;
            font-weight: 300;
            margin-left: 10px;
            opacity: 0.9;
        }
        
        .temp-description {
            font-size: 18px;
            font-weight: 400;
            opacity: 0.9;
            margin-top: 15px;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }
        
        .info-card {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        
        .info-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .info-label {
            font-size: 12px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        
        .info-value {
            font-size: 16px;
            font-weight: 600;
            color: #1e293b;
        }
        
        .footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #e2e8f0;
        }
        
        .footer-text {
            color: #94a3b8;
            font-size: 13px;
        }
        
        .broker-info {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            padding: 12px 20px;
            border-radius: 10px;
            margin-top: 12px;
            font-size: 13px;
            color: #78350f;
            font-weight: 500;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 32px;
            }
            
            .temp-value {
                font-size: 72px;
            }
            
            .temp-unit {
                font-size: 36px;
            }
            
            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="godzilla-emoji">🦖</div>
            <h1>Godzilla Monitor</h1>
        </div>
        
        <div class="candidate">
            Candidate: <span class="candidate-name">NIYOBYOSE Isaac Precieux</span>
        </div>
        
        <div id="statusBar" class="status-bar disconnected">
            <span id="statusText">Disconnected</span>
            <div class="status-indicator"></div>
        </div>
        
        <div class="temp-card">
            <div class="temp-label">Current Temperature</div>
            <div class="temp-display">
                <div class="temp-value" id="temperature">--</div>
                <div class="temp-unit">°C</div>
            </div>
            <div class="temp-description" id="tempDescription">Waiting for data...</div>
        </div>
        
        <div class="info-grid">
            <div class="info-card">
                <div class="info-icon">🕒</div>
                <div class="info-label">Last Update</div>
                <div class="info-value" id="lastUpdate">Never</div>
            </div>
            <div class="info-card">
                <div class="info-icon">📊</div>
                <div class="info-label">Last Temperature</div>
                <div class="info-value" id="lastTemp">--°C</div>
            </div>
        </div>
        
        <div class="footer">
            <div class="footer-text">Real-time temperature monitoring system</div>
            <div class="broker-info">
                📡 MQTT Broker: 157.173.101.159:9001
            </div>
        </div>
    </div>

    <script>
        // MQTT Configuration
        const MQTT_BROKER = "157.173.101.159";
        const MQTT_PORT = 9001; // WebSocket port
        const MQTT_TOPIC = "godzilla/temperature";
        
        let lastTemperature = null;
        
        const client = new Paho.Client(MQTT_BROKER, MQTT_PORT, "web_" + Math.random().toString(16).substr(2, 8));
        
        client.onConnectionLost = (responseObject) => {
            console.log("Connection lost:", responseObject.errorMessage);
            updateStatus(false);
        };
        
        client.onMessageArrived = (message) => {
            console.log("Message received:", message.payloadString);
            try {
                const data = JSON.parse(message.payloadString);
                updateTemperature(data.temperature);
            } catch (e) {
                console.error("Error parsing message:", e);
            }
        };
        
        function connectMQTT() {
            client.connect({
                onSuccess: () => {
                    console.log("Connected to MQTT broker");
                    updateStatus(true);
                    client.subscribe(MQTT_TOPIC);
                },
                onFailure: (error) => {
                    console.error("Connection failed:", error);
                    updateStatus(false);
                    setTimeout(connectMQTT, 5000);
                }
            });
        }
        
        function updateStatus(connected) {
            const statusBar = document.getElementById('statusBar');
            const statusText = document.getElementById('statusText');
            
            if (connected) {
                statusText.textContent = '✓ Connected to Broker';
                statusBar.className = 'status-bar connected';
            } else {
                statusText.textContent = '✗ Disconnected';
                statusBar.className = 'status-bar disconnected';
            }
        }
        
        function getTemperatureDescription(temp) {
            if (temp < 18) return "🥶 Cold";
            if (temp < 23) return "😊 Comfortable";
            if (temp < 28) return "☀️ Warm";
            return "🔥 Hot";
        }
        
        function updateTemperature(temp) {
            const tempValue = parseFloat(temp);
            
            // Update current temperature
            document.getElementById('temperature').textContent = tempValue.toFixed(1);
            document.getElementById('tempDescription').textContent = getTemperatureDescription(tempValue);
            
            // Update last update time
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-US', { 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit' 
            });
            document.getElementById('lastUpdate').textContent = timeString;
            
            // Update last temperature
            if (lastTemperature !== null) {
                document.getElementById('lastTemp').textContent = lastTemperature.toFixed(1) + '°C';
            }
            
            // Store current as last
            lastTemperature = tempValue;
            
            // Add animation effect
            const tempElement = document.getElementById('temperature');
            tempElement.style.transform = 'scale(1.1)';
            setTimeout(() => {
                tempElement.style.transform = 'scale(1)';
            }, 300);
        }
        
        // Connect on page load
        connectMQTT();
    </script>
</body>
</html>
